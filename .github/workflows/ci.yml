name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Tesseract (for the OCR test)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check that it starts
        run: |
          docker build -t resume-screener .
          docker run -d --name rs -p 8000:8000 resume-screener
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && exit 0; sleep 2; done
          docker logs rs
          exit 1
